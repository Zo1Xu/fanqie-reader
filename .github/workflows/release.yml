name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vscode-fanqie-reader

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-fanqie-reader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:check

      - name: Check and test
        run: npm run verify

      - name: Package VSIX
        run: npm run package -- --out "../fanqie-reader-$env:GITHUB_REF_NAME.vsix"

      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $changelog = Get-Content -Raw -Encoding utf8 'vscode-fanqie-reader/CHANGELOG.md'
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## |\z)'
          $notes = [regex]::Match($changelog, $pattern).Groups[1].Value.Trim()
          if (!$notes) { throw "Missing release notes for $version" }
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ($notes -replace '(?m)^- ', '') | Set-Content -Encoding utf8 -LiteralPath $notesPath
          gh release create "$env:GITHUB_REF_NAME" "fanqie-reader-$env:GITHUB_REF_NAME.vsix" --verify-tag --notes-file "$notesPath" --title "fanqieReader $env:GITHUB_REF_NAME"
