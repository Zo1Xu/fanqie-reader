name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-fanqie-reader

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-fanqie-reader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run release:check

      - name: Check and test
        run: npm run verify

      - name: Package VSIX
        run: npm run package -- --out "../fanqie-reader-${GITHUB_REF_NAME}.vsix"

      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "fanqie-reader-${GITHUB_REF_NAME}.vsix" --verify-tag --generate-notes --title "fanqieReader ${GITHUB_REF_NAME}"
